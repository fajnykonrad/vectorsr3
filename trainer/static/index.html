<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kangaroo Trainer</title>
<style>
:root { --bg:#0f1420; --card:#1a2232; --line:#2a3550; --text:#e8ecf4; --dim:#8b96ad;
        --good:#3fb26f; --bad:#e05555; --accent:#5b8def; --warn:#e0a33f; --gold:#f2c14e; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
.wrap { max-width:880px; margin:0 auto; padding:14px; }
header { display:flex; justify-content:space-between; align-items:center;
         gap:10px; margin-bottom:14px; }
h1 { font-size:19px; }
input, button { font:inherit; border-radius:8px; border:1px solid var(--line);
                background:var(--card); color:var(--text); padding:7px 12px; }
button { cursor:pointer; } button:hover { border-color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
input[name=user] { width:130px; }
.hdr-right { display:flex; gap:10px; justify-content:flex-end; align-items:center; }
.timer { font-variant-numeric:tabular-nums; color:var(--warn); font-weight:600; }

/* the pirate-attack scene: full-bleed across the window, with the Elo
   rectangle riding above it */
#scene-box { position:relative; cursor:pointer; margin-bottom:14px;
             width:100vw; margin-left:calc(50% - 50vw); }
#pirate-scene { width:100%; height:auto; image-rendering:pixelated;
                display:block; }
#elo-box { margin:0 auto 8px; width:fit-content; display:flex; gap:10px;
           align-items:baseline; background:var(--card); border:1px solid var(--line);
           border-radius:10px; padding:5px 20px; }
#elo-label { font-size:11px; color:var(--dim); letter-spacing:.06em; }
#elo-value { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;
             transition:color .25s; }
#elo-delta { font-size:13px; font-weight:700; opacity:0; transition:opacity .3s; }
#elo-delta.up { color:var(--good); opacity:1; }
#elo-delta.down { color:var(--bad); opacity:1; }
#elo-value.up { color:var(--good); } #elo-value.down { color:var(--bad); }
#elo-pop { display:none; position:absolute; top:calc(100% + 8px); left:50%;
           transform:translateX(-50%); width:420px; background:var(--card);
           border:1px solid var(--line); border-radius:12px; padding:14px;
           z-index:20; box-shadow:0 8px 30px rgba(0,0,0,.5); text-align:left; }
#elo-pop.open { display:block; }
#elo-pop h3 { font-size:13px; color:var(--dim); margin-bottom:8px; font-weight:600; }
.bars .bar { display:flex; align-items:center; gap:8px; margin:4px 0; }
.bars .name { width:96px; font-size:12px; color:var(--dim); }
.bars .track { flex:1; height:10px; background:#0c111c; border-radius:5px; overflow:hidden; }
.bars .fill { height:100%; background:var(--accent); border-radius:5px;
              transition:width .5s; }
.bars .val { width:96px; font-size:11px; color:var(--dim); text-align:right; }
table.hist { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
table.hist td, table.hist th { padding:3px 5px; border-bottom:1px solid var(--line); text-align:left; }
.good-text { color:var(--good); } .bad-text { color:var(--bad); }

.card { background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:16px; }
.chip { display:inline-block; background:#243048; border-radius:999px; padding:2px 10px;
        font-size:12px; color:var(--dim); margin-right:6px; }
.chip.diff-easy { background:#1d3a2a; color:var(--good); }
.chip.diff-medium { background:#3a331d; color:var(--warn); }
.chip.diff-hard { background:#3a1d1d; color:var(--bad); }
.muted { color:var(--dim); font-size:13px; }
img.problem { max-width:100%; max-height:340px; border-radius:8px; margin-top:10px;
              display:block; background:#fff; }
.opts { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin-top:12px; }
.optbtn { display:flex; align-items:center; justify-content:center;
          min-width:70px; padding:9px 14px; font-weight:600;
          transition:background .25s, border-color .25s, transform .15s; }
.optbtn.sel { border-color:var(--accent); background:#25406e; }
.optbtn.good { border-color:var(--good); background:#1d3a2a; animation:pop .35s; }
.optbtn.bad { border-color:var(--bad); background:#3a1d1d; animation:pop .35s; }
.optbtn:disabled { opacity:1; }
@keyframes pop { 40% { transform:scale(1.08); } }
.sliders { display:flex; gap:10px; margin-top:12px; align-items:center; }
.range-wrap { position:relative; flex:0 0 200px; height:20px; }
.range-track { position:absolute; left:10px; right:10px; top:5px; height:10px;
               background:#0c111c; border-radius:5px; overflow:hidden; }
.range-fill { position:absolute; left:0; top:0; height:10px; width:50%;
              background:var(--accent); border-radius:5px; }
#certainty { -webkit-appearance:none; appearance:none; position:relative;
             width:100%; height:20px; margin:0; padding:0; border:none;
             background:transparent; outline:none; cursor:pointer; }
#certainty::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
             width:20px; height:20px; border-radius:50%; background:var(--accent);
             border:2px solid #0f1420; box-shadow:0 0 0 1px var(--line); }
#certainty::-moz-range-thumb { width:20px; height:20px; border-radius:50%;
             background:var(--accent); border:2px solid #0f1420; }
.row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.hint { border-left:3px solid var(--warn); padding:6px 10px; margin-top:10px;
        background:#2a2620; border-radius:0 8px 8px 0; }
.hint .src { color:var(--dim); font-size:12px; }
.explain { border-left:3px solid var(--good); padding:8px 12px; margin-top:12px;
           background:#1d2a24; border-radius:0 8px 8px 0; white-space:pre-wrap; }
.explain .src { color:var(--dim); font-size:12px; }
#verdict { margin-top:14px; }
.verdict-line { font-size:16px; font-weight:700; }
.verdict-line.good { color:var(--good); } .verdict-line.bad { color:var(--bad); }
#status { color:var(--dim); font-size:13px; min-height:18px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🦘 Kangaroo Trainer</h1>
  <div class="hdr-right">
    <input name="user" placeholder="your name" value="guest">
    <span class="timer" id="timer"></span>
  </div>
</header>
<div id="scene-box" title="Your general Elo, as a pirate attack — click for the per-topic ratings">
  <div id="elo-box">
    <span id="elo-label">GENERAL ELO</span>
    <span id="elo-value">700</span><span id="elo-delta"></span>
  </div>
  <canvas id="pirate-scene" width="200" height="60"></canvas>
  <div id="elo-pop">
    <h3>Your ratings per topic</h3>
    <div class="bars" id="bars"></div>
    <h3 style="margin-top:10px">Recent attempts</h3>
    <table class="hist" id="hist"></table>
  </div>
</div>
<div id="status">Loading…</div>

<div class="card" id="problem-card">
  <div><span class="chip" id="p-topic"></span><span class="chip" id="p-year"></span>
       <span class="chip" id="p-level"></span>
       <span class="chip" id="p-diff"></span></div>
  <div id="p-text" style="display:none"></div>
  <img class="problem" id="p-img" style="display:none">
  <div class="opts" id="p-opts"></div>
  <div class="sliders">
    <span class="muted">How sure?</span>
    <div class="range-wrap">
      <div class="range-track"><div class="range-fill" id="certainty-fill"></div></div>
      <input type="range" id="certainty" min="1" max="5" step="1" value="5">
    </div>
    <span class="chip" id="certainty-label">totally sure</span>
  </div>
  <div class="row">
    <button id="btn-answer" disabled>Answer</button>
    <button id="btn-hint">Get a hint</button>
    <button id="btn-reveal" style="display:none">Reveal the answer</button>
    <button id="btn-next" style="display:none">Next problem →</button>
    <button id="btn-skip">Skip</button>
  </div>
  <div id="hint-box"></div>
  <div id="verdict" style="display:none"></div>
</div>
</div>

<script src="/static/pirates.js"></script>
<script>
"use strict";
const LETTERS = ["A","B","C","D","E"];
const SURE = ["a guess","not sure","thinking","quite sure","totally sure"];
const user = () => document.querySelector("input[name=user]").value.trim() || "guest";
let problem = null, certainty = 3, choice = null, startTs = 0, hintRung = 0,
    timerId = null, overall = 800, answered = false;
const $ = id => document.getElementById(id);
const show = (el, on) => el.style.display = on ? "" : "none";

function setStatus(t){ $("status").textContent = t; }
function setCertainty(v){
  certainty = parseInt(v, 10);
  $("certainty-label").textContent = SURE[certainty - 1];
  // the visible track is inset by the thumb radius on both sides, so the
  // thumb's center travels exactly from the track's left end to its right
  // end; the fill follows, and at 5 the circle sits on the very end
  const pct = (certainty - 1) / 4 * 100;
  $("certainty-fill").style.width = pct + "%";
}

/* ---- the general Elo: tween the number, drive the pirates ---- */
function setOverall(from, to){
  const el = $("elo-value"), delta = $("elo-delta");
  const wentUp = to > from, wentDown = to < from;
  if (window.Pirates) Pirates.setTarget(to);
  const t0 = performance.now(), DUR = 900;
  cancelAnimationFrame(setOverall._raf);
  (function step(now){
    const k = Math.min(1, (now - t0) / DUR);
    const ease = 1 - Math.pow(1 - k, 3);           // ease-out cubic
    el.textContent = Math.round(from + (to - from) * ease);
    if (k < 1) setOverall._raf = requestAnimationFrame(step);
  })(t0);
  el.classList.remove("up","down");
  delta.classList.remove("up","down");
  if (wentUp || wentDown){
    el.classList.add(wentUp ? "up" : "down");
    delta.textContent = (wentUp ? "+" : "") + (to - from);
    delta.classList.add(wentUp ? "up" : "down");
    setTimeout(() => delta.classList.remove("up","down"), 2600);
  }
}

async function api(url, opts){
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  return r.json();
}

function startTimer(){
  startTs = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => {
    $("timer").textContent = ((Date.now() - startTs)/1000).toFixed(0) + " s";
  }, 250);
}

async function next(){
  setStatus("Choosing a problem…");
  try {
    const forced = new URLSearchParams(location.search).get("problem");
    const data = await api(`/api/next?user=${encodeURIComponent(user())}` +
                           (forced ? `&problem=${forced}` : ""));
    problem = data.problem;
    answered = false; hintRung = 0; choice = null;
    $("certainty").value = 5; setCertainty(5);
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const diffNames = ["Easy", "Medium", "Hard"];
    $("p-topic").textContent = cap(data.topic);
    $("p-diff").textContent = diffNames[problem.difficulty || 0];
    $("p-diff").className = "chip diff-" + diffNames[problem.difficulty || 0].toLowerCase();
    $("p-level").textContent = "Level " + (problem.level ?? "?");
    $("p-year").textContent = problem.year ?? "?";
    $("p-text").textContent = problem.text;
    $("p-text").style.display = "none";   // the image carries the full problem
    const img = $("p-img");
    img.src = `/image/${problem.id}_${problem.language}.png`;
    show(img, true);
    const opts = $("p-opts"); opts.innerHTML = "";
    // Letters only, never the values: the figures and numbers live in the
    // problem image above.
    LETTERS.forEach(l => {
      const b = document.createElement("button");
      b.className = "optbtn"; b.dataset.letter = l;
      b.textContent = l;
      b.onclick = () => { if (answered) return; choice = l;
        [...opts.children].forEach(x => x.classList.toggle("sel", x === b));
        $("btn-answer").disabled = false; };
      opts.appendChild(b);
    });
    $("hint-box").innerHTML = "";
    show($("verdict"), false);
    show($("btn-reveal"), false); show($("btn-next"), false); show($("btn-skip"), true);
    $("btn-hint").disabled = false;
    $("btn-answer").disabled = true;
    $("timer").textContent = "";
    setStatus("");
    startTimer();
  } catch (e){ setStatus("Error: " + e.message); }
}

async function answer(){
  if (!choice || !problem || answered) return;
  const seconds = (Date.now() - startTs)/1000;
  answered = true;
  $("btn-answer").disabled = true;
  $("btn-hint").disabled = true;
  show($("btn-reveal"), false);
  setStatus("");
  try {
    const r = await api("/api/answer", { method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ user:user(), problem:problem.id, answer:choice,
                             certainty, seconds, hint_rung:hintRung })});
    clearInterval(timerId);
    // paint the buttons: chosen green/red, and the correct one green too
    const buttons = [...$("p-opts").children];
    buttons.forEach(b => {
      b.disabled = true;
      b.classList.remove("sel");
      if (b.dataset.letter === r.label) b.classList.add("good");
      if (b.dataset.letter === choice && !r.correct) b.classList.add("bad");
    });
    const delta = Math.round(r.elo_after - r.elo_before);
    const v = $("verdict");
    v.innerHTML =
      `<div class="verdict-line ${r.correct ? "good" : "bad"}">` +
      `${r.correct ? "✔ Correct!" : "✘ Not quite"}` +
      `</div>` +
      `<div class="muted">${problem.id} · topic <b>${r.topic}</b> · ` +
      `topic rating ${Math.round(r.elo_before)} → <b>${Math.round(r.elo_after)}</b> ` +
      `<span class="${delta >= 0 ? "good-text" : "bad-text"}">(${delta >= 0 ? "+" : ""}${delta})</span>` +
      (hintRung ? ` · with ${hintRung} hint${hintRung > 1 ? "s" : ""}` : "") +
      `</div>`;
    if (r.explanation){
      const ex = r.explanation;
      let html =
        `<div class="explain"><span class="src">Why the answer is ${r.label} ` +
        `(${ex.source}):</span><br>${ex.text}</div>`;
      if (ex.neighbour){
        const n = ex.neighbour;
        const nAnswer = n.label ? ` — answer ${n.label}` : "";
        html +=
          `<div class="hint"><span class="src">A similar solved problem ` +
          `(${n.source}${nAnswer}):</span><br>${n.text}</div>`;
      }
      v.insertAdjacentHTML("beforeend", html);
    }
    show($("verdict"), true);
    show($("btn-next"), true); show($("btn-skip"), false);
    setOverall(r.overall_before, r.overall_after);
    overall = r.overall_after;
    v.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e){
    setStatus("Error: " + e.message);
    answered = false;
    $("btn-answer").disabled = false;
    $("btn-hint").disabled = false;
  }
}

async function hint(){
  if (!problem || answered) return;
  $("btn-hint").disabled = true;
  hintRung += 1;
  setStatus("Getting hint " + hintRung + "…");
  try {
    const r = await api(`/api/hint?user=${encodeURIComponent(user())}` +
                        `&problem=${problem.id}&rung=${hintRung}`);
    const box = $("hint-box");
    if (r.rung === 1 && r.neighbour){
      const n = r.neighbour;
      box.insertAdjacentHTML("beforeend",
        `<div class="hint"><span class="src">Rung 1 · a similar solved problem (${r.source}):</span><br>` +
        `${n.text}</div>`);
    } else if (r.rung === 2){
      box.insertAdjacentHTML("beforeend",
        `<div class="hint"><span class="src">Rung 2 · the method:</span><br>${r.text}</div>`);
    } else if (r.rung === 3){
      box.insertAdjacentHTML("beforeend",
        `<div class="hint"><span class="src">Rung 3 · from the model:</span><br>${r.text}</div>`);
    } else if (r.rung === 4){
      box.insertAdjacentHTML("beforeend",
        `<div class="hint"><span class="src">Rung 4 · revealed:</span> the answer is ` +
        `<b>${r.label}</b></div>`);
    }
    if (hintRung < 4) $("btn-hint").disabled = false;
    if (hintRung >= 3) show($("btn-reveal"), true);
    setStatus("");
  } catch (e){ setStatus("Error: " + e.message); hintRung -= 1; $("btn-hint").disabled = false; }
}

async function refreshPopover(){
  try {
    const s = await api(`/api/stats?user=${encodeURIComponent(user())}`);
    overall = s.overall;
    $("elo-value").textContent = s.overall;
    if (window.Pirates) Pirates.setTarget(s.overall);
    const bars = $("bars"); bars.innerHTML = "";
    const entries = Object.entries(s.ratings).sort((a,b) => a[0].localeCompare(b[0]));
    const lo = 600, hi = 1100;
    entries.forEach(([t, v]) => {
      const pct = Math.max(2, Math.min(100, (v.rating - lo)/(hi - lo)*100));
      bars.insertAdjacentHTML("beforeend",
        `<div class="bar"><span class="name">${t}</span>` +
        `<div class="track"><div class="fill" style="width:${pct}%"></div></div>` +
        `<span class="val">${v.rating} · ${v.n} tried</span></div>`);
    });
    const h = $("hist");
    h.innerHTML = "<tr><th>problem</th><th>topic</th><th></th><th>sure</th><th>time</th></tr>" +
      s.attempts.slice(0, 8).map(a =>
        `<tr><td>${a.problem}</td><td>${a.topic}</td>` +
        `<td class="${a.correct ? "good-text" : "bad-text"}">${a.correct ? "✔" : "✘"}</td>` +
        `<td>${a.certainty}/5</td><td>${a.seconds}s</td></tr>`).join("");
  } catch (e){ /* the popover just stays as it is */ }
}

$("scene-box").onclick = async () => {
  const pop = $("elo-pop");
  const open = !pop.classList.contains("open");
  pop.classList.toggle("open", open);
  if (open) await refreshPopover();
};
document.addEventListener("click", e => {
  if (!$("scene-box").contains(e.target)) $("elo-pop").classList.remove("open");
});

setCertainty(5);
if (window.Pirates) Pirates.init();
$("certainty").addEventListener("input", e => setCertainty(e.target.value));
$("btn-answer").onclick = answer;
$("btn-hint").onclick = hint;
$("btn-reveal").onclick = () => { hintRung = 4; hint(); show($("btn-reveal"), false); };
$("btn-next").onclick = next;
$("btn-skip").onclick = next;
next();
</script>
</body>
</html>
